<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="打刻">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>打刻アプリ</title>
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
  :root {
    --bg: #dbeafe;
    --card: #ffffff;
    --card-soft: #dbeafe;
    --text: #0f172a;
    --muted: #64748b; /* image-like muted gray */
    /* Palette (from mockup image) */
    --in: #2563EB;        /* primary blue */
    --in-dark: #1D4ED8;   /* darker blue */
    --out: #F59E0B;       /* orange */
    --out-dark: #EA580C;  /* darker orange */

    --gaishutsu: #2563EB;
    --kisha:#F59E0B;
    --tyokko: #2563EB;
    --tyokki:#F59E0B;
    --kyuka: #22D29A;
    --zaitaku: #FE7BBA;
    
    --success: #FE7BBA;   /* 帰社 */
    --accent: #8B5CF6;    /* purple */
    --muted-2: #64748B;
    --border: rgba(15,23,42,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
                 "Hiragino Sans", Meiryo, sans-serif;
    background: linear-gradient(160deg, #93c5fd 0%, #bfdbfe 55%, #c7d9f5 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 10px; justify-content: center;
  }
  header p {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .clock-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 26px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(15,23,42,0.08), inset 0 1px 0 rgba(255,255,255,0.6);
    min-width: 0;
  }
  .date { color: var(--muted); font-size: 1rem; }
  .time {
    /* responsive font size to avoid overflow on narrow devices */
    font-size: clamp(1.6rem, 6.5vw, 3.4rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    margin: 6px 0 14px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    padding: 6px 16px;
    border-radius: 999px;
    background: var(--card-soft);
    color: var(--muted);
  }
  .status .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted-2);
  } 
  .status.working { color: var(--in); }
  .status.working .dot { background: var(--in); box-shadow: 0 0 8px var(--in); }
  .status.done { color: var(--accent); }
  .status.done .dot { background: var(--accent); }
  .status.break { color: #4338ca; }
  .status.break .dot { background: #4338ca; box-shadow: 0 0 8px #818cf8; }
  .status.none { color: #dc2626; font-weight: 600; }
  .status.none .dot { background: #dc2626; }

  .buttons {
    display: block;
    margin: 22px 0;
  }
  .buttons .primary {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .row-main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  /* 小ボタン群はフレックスレイアウトで4列に見せる */
  .row-secondary { display: flex; flex-wrap: wrap; gap: 8px; }
  /* 小さい丸いボタン：正方形にして中央揃え */
  .punch.small {
    /* compact rectangular white button with left icon badge */
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    font-size: 1.05rem; /* ボタンタイトルを少し大きく表示 */
    border-radius: 12px;
    padding: 10px 12px 10px 6px; /* 左側の余白を小さくしてアイコンを左寄せに見せる */
    box-sizing: border-box;
    /* four per row: calc 25% minus gaps (3 gaps of 8px total) */
    flex: 0 0 calc((100% - 3*8px) / 4);
    min-width: 0;
    max-width: 220px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted-2);
    box-shadow: 0 6px 18px rgba(15,23,42,0.05);
  }
  .punch.small .icon-circle { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 40px; }
  /* アウト用のカスタム画像を表示する場合の調整 */
  .punch.small .icon-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
  /* icon color classes to match the mockup palette */
  .icon-circle.in { background: linear-gradient(160deg, var(--tyokko), var(--tyokko)); }
  .icon-circle.out { background: linear-gradient(160deg, var(--gaishutsu), var(--gaishutsu)); }
  .icon-circle.success { background: linear-gradient(160deg, var(--kisha), var(--kisha)); }
  .icon-circle.danger { background: linear-gradient(160deg, var(--tyokki), var(--tyokki)); }
  .icon-circle.info { background: linear-gradient(160deg, var(--zaitaku), var(--zaitaku)); }
  .icon-circle.accent { background: linear-gradient(160deg, var(--kyuka), var(--kyuka)); }
  
  /* 小ボタンにアイコンと同色の2pxボーダーを付与（data-color 属性で指定） */
  button.punch.small[data-color="tyokko"] { border: 2px solid var(--tyokko); }
  button.punch.small[data-color="gaishutsu"] { border: 2px solid var(--gaishutsu); }
  button.punch.small[data-color="kisha"] { border: 2px solid var(--kisha); }
  button.punch.small[data-color="tyokki"] { border: 2px solid var(--tyokki); }
  button.punch.small[data-color="zaitaku"] { border: 2px solid var(--zaitaku); }
  button.punch.small[data-color="kyuka"] { border: 2px solid var(--kyuka); }
  
  .punch.small .icon-circle .bi { color: #fff; font-size: 1.05rem; }
  .punch.small .sub { font-size: 0.65rem; opacity: 0.8; margin-top: 2px; display: block; }
  .punch.small .sub { display: none; }
  /* テキストが長い場合は改行して収める */
  .punch.small { white-space: normal; overflow-wrap: anywhere; }
  /* 出勤/退勤下のセパレータ */
  .buttons .primary .separator {
    grid-column: 1 / -1;
    height: 1px;
    background: linear-gradient(90deg, rgba(0,0,0,0.06), rgba(0,0,0,0.04));
    margin: 6px 0 12px;
    border-radius: 2px;
  }
  .buttons .more {
    margin-top: 10px;
    display: none;
  }
  /* hidden 属性で制御（JS が属性を付け外しするため） */
  .more[hidden] { display: none; }
  button.punch {
    border: none;
    border-radius: 18px;
    padding: 44px 20px;
    font-size: 1.9rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.2s ease, filter 0.2s ease;
    width: 100%;
    box-sizing: border-box;
  }
  /* 出勤/退勤は大きめ、その他は .punch.small で上書き */
  .punch.in, .punch.out { padding: 40px 20px; font-size: 1.5rem; }
  /* Neo Work: ボタン色の統一マッピング */
  .primary .in { background: linear-gradient(160deg, var(--in), var(--in-dark)); color: #fff; box-shadow: 0 10px 30px rgba(37,99,235,0.18); }
  .primary .out { background: linear-gradient(160deg, var(--out), var(--out-dark)); color: #fff; box-shadow: 0 10px 30px rgba(245,158,11,0.18); }
  /* 非.small ボタンは data-color 属性で色指定を行う（各ボタン名に沿った変数を使用） */
  button.punch:not(.small)[data-color="in"] { background: linear-gradient(160deg, var(--in), var(--in-dark)); color: #fff; box-shadow: 0 10px 30px rgba(37,99,235,0.18); }
  button.punch:not(.small)[data-color="out"] { background: linear-gradient(160deg, var(--out), var(--out-dark)); color: #fff; box-shadow: 0 10px 30px rgba(245,158,11,0.18); }
  button.punch:not(.small)[data-color="success"] { background: linear-gradient(160deg, var(--success), #047857); color: #fff; }
  button.punch:not(.small)[data-color="directhome"] { background: linear-gradient(160deg, #ef4444, #991b1b); color: #fff; }
  button.punch:not(.small)[data-color="leave"] { background: linear-gradient(160deg, var(--accent), #6d28d9); color: #fff; }
  button.punch:not(.small)[data-color="leaveAM"] { background: linear-gradient(160deg, #f97316, #fb923c); color: #fff; }
  button.punch:not(.small)[data-color="leavePM"] { background: linear-gradient(160deg, #ef4444, #fb7185); color: #fff; }
  button.punch:not(.small)[data-color="wfh"] { background: linear-gradient(160deg, #06b6d4, #1e3a8a); color: #fff; }
  /* ラベルが改行されないようにする（狭い画面ではオーバーフローを防ぐため上書きします） */
  button.punch { white-space: nowrap; }
  button.punch .sub { display: block; font-size: 0.66rem; font-weight: 500; opacity: 0.85; margin-top: 4px; letter-spacing: 0.05em; }
  /* icon inside buttons */
  .punch .bi { font-size: 1.0rem; margin-right: 8px; vertical-align: middle; }
  /* small buttons: icon smaller and above label when space allows */
  .punch.small .bi { font-size: 1rem; margin-right: 0; }
  
  button.brk { background: linear-gradient(160deg, #6366f1, #4338ca); }
  button.out { background: linear-gradient(160deg, var(--out), var(--out-dark)); }
    /* 追加ボタン色（モックに近い配色）: data-color 属性で指定 */
    button.punch:not(.small)[data-color="out"] { background: linear-gradient(160deg, var(--out), var(--out-dark)); color: #fff; }
    button.punch:not(.small)[data-color="success"] { background: linear-gradient(160deg, var(--success), #047857); color: #fff; }
    button.punch:not(.small)[data-color="in"] { background: linear-gradient(160deg, var(--in), var(--in-dark)); color: #fff; }
    button.punch:not(.small)[data-color="directhome"] { background: linear-gradient(160deg, #ef4444, #991b1b); color: #fff; }
    button.punch:not(.small)[data-color="leave"] { background: linear-gradient(160deg, var(--accent), #6d28d9); color: #fff; }
    button.punch:not(.small)[data-color="leaveAM"] { background: linear-gradient(160deg, #f97316, #fb923c); color: #fff; }
    button.punch:not(.small)[data-color="leavePM"] { background: linear-gradient(160deg, #ef4444, #fb7185); color: #fff; }
    button.punch:not(.small)[data-color="wfh"] { background: linear-gradient(160deg, #06b6d4, #1e3a8a); color: #fff; }

    /* 小ボタンは白背景にアイコンだけカラーリング（.icon-circle に色が付くので不要だが互換性保持） */
    button.punch.small[data-color="gaishutsu"] .bi { color: var(--gaishutsu); }
    button.punch.small[data-color="tyokko"] .bi { color: var(--tyokko); }
    button.punch.small[data-color="kisha"] .bi { color: var(--kisha); }
    button.punch.small[data-color="tyokki"] .bi { color: var(--tyokki); }
    button.punch.small[data-color="zaitaku"] .bi { color: var(--zaitaku); }
    button.punch.small[data-color="kyuka"] .bi { color: var(--kyuka); }
  /* ホバーとアクティブの共通挙動（Neo Work） */
  button.punch:hover, .btn-large:hover, .btn-small:hover { filter: brightness(0.97); transform: translateY(-1px); }
  button.punch:active:not(:disabled), .btn-large:active:not(:disabled), .btn-small:active:not(:disabled) { transform: scale(0.97); }
  button.punch:disabled { opacity: 0.32; cursor: not-allowed; filter: grayscale(0.4); }

  .today {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    text-align: center;
  }
  .today .label { color: var(--muted); font-size: 0.75rem; margin-bottom: 6px; }
  .today .val { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .today .full { grid-column: 1 / -1; border-top: 1px dashed var(--border); padding-top: 12px; }

  /* モーダル */
  .modal-overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10000;
    background: rgba(0,0,0,0.45);
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--card); color: var(--text); padding: 18px; border-radius: 12px; width: 92%; max-width: 420px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .modal-row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .modal-row label { width: 72px; color: var(--muted); font-size: 0.9rem; }
  .modal-row input, .modal-row textarea { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; }
  .modal-row textarea { resize: vertical; min-height: 44px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .modal-btn { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  .modal-btn.primary { background: linear-gradient(160deg, var(--in), var(--in-dark)); color: #fff; border: none; }
  /* 在宅/休暇モーダルの選択ボタンをフレックスで均等配置 */
  #leaveOptions { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  #leaveOptions .modal-btn { flex: 1 1 0; min-width: 0; text-align: center; padding: 10px 12px; }
  #leaveOptions .modal-btn + .modal-btn { margin-left: 0; }

  .history {
    margin-top: 26px;
  }
  .history h2 {
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history .clear {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .history .clear:hover { color: #f87171; border-color: #f87171; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.78rem; }
  td { font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .empty { color: var(--muted); text-align: center; padding: 18px; font-size: 0.85rem; }
  td.dash { color: var(--muted); }

  footer { text-align: center; color: var(--muted); font-size: 0.72rem; margin-top: 22px; }

  /* ---- 指紋認証ロック画面 ---- */
  .lock-overlay {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #1e3a8a 0%, #1d4ed8 55%, #2563eb 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; color: #fff; text-align: center; padding: 24px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .lock-overlay .lock-icon { transition: transform 0.4s ease; }
  .lock-overlay:active .lock-icon { transform: scale(1.1); }
  .lock-overlay.hidden { display: none; }
  .lock-box { max-width: 360px; width: 100%; }
  .lock-icon { font-size: 4rem; margin-bottom: 20px; line-height: 1; }
  .lock-overlay h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
  .lock-overlay p { font-size: 0.95rem; opacity: 0.88; margin-bottom: 28px; line-height: 1.5; }
  .lock-error { margin-top: 8px; font-size: 0.85rem; color: #fecaca; min-height: 1.2em; }
  .lock-link {
    margin-top: 26px; background: none; border: none;
    color: rgba(255,255,255,0.7); font-size: 0.78rem;
    text-decoration: underline; cursor: pointer;
  }
  .lock-link:hover { color: #fff; }

  /* ---- 認証設定ボタン ---- */
  .auth-settings { margin-top: 18px; text-align: center; }
  .auth-btn {
    background: var(--card); border: 1px solid var(--border);
    color: var(--accent); font-size: 0.85rem; font-weight: 600;
    padding: 10px 18px; border-radius: 10px; cursor: pointer;
  }
  .auth-btn[hidden] { display: none; }
  .auth-btn:hover { filter: brightness(0.97); }
  .auth-btn.danger { color: #b91c1c; border-color: #fecaca; background: #fff5f5; }
  .auth-note { color: var(--muted); font-size: 0.78rem; margin-top: 8px; }

  /* レスポンシブ調整：幅の狭いデバイスでボタンがはみ出さないように縮小・改行を許可 */
  @media (max-width: 420px) {
    .clock-card { padding: 20px 14px; }
    .buttons .primary { gap: 8px; }
    button.punch {
      padding: 18px 10px;
      font-size: 1.05rem;
      border-radius: 12px;
      white-space: normal; /* ラベルの改行を許可して横にはみ出さないようにする */
      overflow-wrap: break-word;
      word-break: break-word;
    }
    /* スマホでは小ボタンを縦並びにしてアイコンとラベルを中央揃えにする */
    .punch.small {
      aspect-ratio: 1 / 1;
      padding: 8px 6px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 6px;
      
    }
    .punch.small .icon-circle { margin-bottom: 0; }
    .punch.small > span { display: block; }
    button.punch .sub { font-size: 0.62rem; margin-top: 6px; display: block; }
  }
  /* 中程度の幅でもはみ出す問題に備え、より広めの閾値で調整 */
  @media (max-width: 520px) {
    .buttons .primary { gap: 10px; }
    button.punch { font-size: 1.2rem; padding: 20px 12px; white-space: normal; overflow-wrap: break-word; }
    button.punch .sub { font-size: 0.64rem; }
  }
</style>
</head>
<body>
  <div class="lock-overlay hidden" id="lockOverlay">
    <div class="lock-box">
      <div class="lock-icon">🔒</div>
      <h2>ロック中</h2>
      <p id="lockHint">指紋認証を起動しています…</p>
      <div class="lock-error" id="lockError"></div>
      <button class="lock-link" id="btnResetAuth">認証情報をリセット</button>
    </div>
  </div>

  <div class="app">
    <header>
      <h1>⏱ 打刻アプリ</h1>
      <p>出勤・退勤を記録します</p>
    </header>

    <div class="clock-card">
      <div class="date" id="date">----年--月--日 (-)</div>
      <div class="time" id="clock">--:--:--</div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">未出勤</span></div>

      <div class="buttons">
        <div class="primary">
          <div class="row-main">
            <button class="punch in" id="btnIn" data-color="in"><i class="bi bi-clock-fill" aria-hidden="true"></i>出勤<span class="sub">CLOCK IN</span></button>
            <button class="punch out" id="btnOut" data-color="out"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>退勤<span class="sub">CLOCK OUT</span></button>
          </div>

          <div class="separator" aria-hidden="true"></div>

          <div class="row-secondary">
            <button class="punch small" id="btnOuting" data-color="gaishutsu"><span class="icon-circle "><img src="Designer.svg" alt="外出"></span><span>外出<span class="sub">GO OUT</span></span></button>
            <button class="punch small" id="btnDirectGo" data-color="tyokko"><span class="icon-circle "><i class="bi bi-arrow-up-right-circle" aria-hidden="true"></i></span><span>直行<span class="sub">DIRECT GO</span></span></button>
            <button class="punch small" id="btnReturn" data-color="kisha"><span class="icon-circle "><i class="bi bi-door-closed-fill" aria-hidden="true"></i></span><span>帰社<span class="sub">RETURN</span></span></button>
            <button class="punch small" id="btnDirectHome" data-color="tyokki"><span class="icon-circle "><i class="bi bi-arrow-down-right-circle" aria-hidden="true"></i></span><span>直帰<span class="sub">DIRECT HOME</span></span></button>
            <button class="punch small" id="btnWFH" data-color="zaitaku"><span class="icon-circle "><i class="bi bi-pc-display-horizontal" aria-hidden="true"></i></span><span>在宅<span class="sub">WFH</span></span></button>
            <button class="punch small" id="btnLeave" data-color="kyuka"><span class="icon-circle "><i class="bi bi-house" aria-hidden="true"></i></span><span>休暇<span class="sub">LEAVE</span></span></button>
          </div>
        </div>
      </div>
      <!-- 在宅／休暇選択モーダル -->
      <div class="modal-overlay" id="leaveModal" hidden>
        <div class="modal-box">
          <h3 id="leaveTitle">選択</h3>
          <div class="modal-row" id="leaveOptions">
            <button class="modal-btn" data-val="終日">終日</button>
            <button class="modal-btn" data-val="午前">午前</button>
            <button class="modal-btn" data-val="午後">午後</button>
          </div>
          <div class="modal-row">
            <label for="leaveRemark">備考</label>
            <textarea id="leaveRemark" rows="2" placeholder="備考（自動入力可）"></textarea>
          </div>
          <div class="modal-actions">
            <button class="modal-btn" id="leaveCancel">キャンセル</button>
            <button class="modal-btn primary" id="leaveConfirm">保存</button>
          </div>
        </div>
      </div>
      <!-- 予定入力モーダル -->
      <div class="modal-overlay" id="returnModal" hidden>
        <div class="modal-box">
          <h3 id="modalTitle">戻り予定を入力</h3>
          <div class="modal-row">
            <label for="modalDate">日付</label>
            <input type="date" id="modalDate">
          </div>
          <div class="modal-row">
            <label for="modalTime">時間</label>
            <input type="time" id="modalTime">
          </div>
          <div class="modal-row">
            <label for="modalRemark">備考</label>
            <textarea id="modalRemark" rows="2" placeholder="外出先やメモ"></textarea>
          </div>
          <div class="modal-actions">
            <button class="modal-btn" id="modalCancel">キャンセル</button>
            <button class="modal-btn primary" id="modalConfirm">保存</button>
          </div>
        </div>
      </div>

      <div class="today">
        <div><div class="label">出勤</div><div class="val" id="todayIn">--:--</div></div>
        <div><div class="label">退勤</div><div class="val" id="todayOut">--:--</div></div>
        <div><div class="label">休憩</div><div class="val" id="todayBreak">0:00</div></div>
        <div><div class="label">勤務時間</div><div class="val" id="todayWork">--:--</div></div>
        <div class="full"><div class="label">残業 (8時間超 / 15分単位)</div><div class="val" id="todayOvertime">--:--</div></div>
      </div>
    </div>

    <div class="history">
      <h2>直近の記録 <button class="clear" id="btnClear">全削除</button></h2>
      <table>
        <thead>
          <tr><th>日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>勤務</th><th>残業</th><th>状態</th><th>タグ</th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>

    <div class="auth-settings">
      <button class="auth-btn" id="btnAuthSetup" hidden>🔐 指紋認証を有効にする</button>
      <button class="auth-btn danger" id="btnAuthRemove" hidden>指紋認証を無効にする</button>
      <button class="auth-btn" id="btnInstall" hidden>⬇️ インストール</button>
      <p class="auth-note" id="authNote" hidden>指紋認証はHTTPS (または localhost) でのみ利用できます。</p>
    </div>

    <footer>データはこのブラウザ内にのみ保存されます</footer>
  </div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "dakoku_records_v1";
  const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

  // ---- 日付/時刻ユーティリティ ----
  const pad = (n) => String(n).padStart(2, "0");

  function dateKey(d) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function formatDateJP(d) {
    return `${d.getFullYear()}年${pad(d.getMonth() + 1)}月${pad(d.getDate())}日 (${WEEKDAYS[d.getDay()]})`;
  }
  function formatTime(d) {
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  // ISO文字列 → "HH:MM"
  function hhmm(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  // 2つのISO間の勤務時間 "H:MM"
  function workSpan(inIso, outIso) {
    if (!inIso || !outIso) return null;
    let ms = new Date(outIso) - new Date(inIso);
    if (ms < 0) return null;
    const totalMin = Math.floor(ms / 60000);
    return `${Math.floor(totalMin / 60)}:${pad(totalMin % 60)}`;
  }
  // ミリ秒 → "H:MM" (0以下は "0:00")
  function msToHMM(ms) {
    if (!ms || ms <= 0) return "0:00";
    const totalMin = Math.floor(ms / 60000);
    return `${Math.floor(totalMin / 60)}:${pad(totalMin % 60)}`;
  }
  // 累計休憩ms (進行中の休憩は untilIso まで)
  function totalBreakMs(rec, untilIso) {
    if (!rec || !Array.isArray(rec.breaks)) return 0;
    let ms = 0;
    for (const b of rec.breaks) {
      if (!b || !b.start) continue;
      const end = b.end || untilIso;
      if (!end) continue;
      const d = new Date(end) - new Date(b.start);
      if (d > 0) ms += d;
    }
    return ms;
  }
  function isOnBreak(rec) {
    if (!rec || !Array.isArray(rec.breaks) || rec.breaks.length === 0) return false;
    const last = rec.breaks[rec.breaks.length - 1];
    return !!(last && last.start && !last.end);
  }
  // 休憩控除後の勤務時間
  function netWorkSpan(inIso, outIso, breaksMs) {
    if (!inIso || !outIso) return null;
    let ms = new Date(outIso) - new Date(inIso) - (breaksMs || 0);
    if (ms < 0) ms = 0;
    return msToHMM(ms);
  }
  // 休憩控除後の勤務分 (number)
  function netWorkMin(inIso, outIso, breaksMs) {
    if (!inIso || !outIso) return null;
    let ms = new Date(outIso) - new Date(inIso) - (breaksMs || 0);
    if (ms < 0) ms = 0;
    return Math.floor(ms / 60000);
  }
  function minToHMM(min) {
    if (min == null || min < 0) return "0:00";
    return `${Math.floor(min / 60)}:${pad(min % 60)}`;
  }
  // 残業時間 (通常8時間超、15分単位で切り捨て)
  const STANDARD_MIN = 480; // 8h
  function overtimeHMM(workMin) {
    if (workMin == null) return null;
    const over = Math.max(0, workMin - STANDARD_MIN);
    const rounded = Math.floor(over / 15) * 15;
    return minToHMM(rounded);
  }

  // ---- データ ----
  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }
  function save(records) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  let records = load();

  // ---- 要素 ----
  const el = {
    date: document.getElementById("date"),
    clock: document.getElementById("clock"),
    status: document.getElementById("status"),
    statusText: document.getElementById("statusText"),
    btnIn: document.getElementById("btnIn"),
    btnOut: document.getElementById("btnOut"),
    todayIn: document.getElementById("todayIn"),
    todayOut: document.getElementById("todayOut"),
    todayWork: document.getElementById("todayWork"),
    historyBody: document.getElementById("historyBody"),
    btnClear: document.getElementById("btnClear"),
    todayBreak: document.getElementById("todayBreak"),
    todayOvertime: document.getElementById("todayOvertime"),
    btnOuting: document.getElementById("btnOuting"),
    btnReturn: document.getElementById("btnReturn"),
    btnDirectGo: document.getElementById("btnDirectGo"),
    btnDirectHome: document.getElementById("btnDirectHome"),
    btnLeave: document.getElementById("btnLeave"),
    btnLeaveAM: document.getElementById("btnLeaveAM"),
    btnLeavePM: document.getElementById("btnLeavePM"),
    btnWFH: document.getElementById("btnWFH"),
    lockOverlay: document.getElementById("lockOverlay"),
    lockHint: document.getElementById("lockHint"),
    btnResetAuth: document.getElementById("btnResetAuth"),
    lockError: document.getElementById("lockError"),
    btnAuthSetup: document.getElementById("btnAuthSetup"),
    btnAuthRemove: document.getElementById("btnAuthRemove"),
    btnInstall: document.getElementById("btnInstall"),
    authNote: document.getElementById("authNote"),
  };

  // ---- PWA Install handling ----
  let deferredPrompt = null;
  // beforeinstallprompt を監視してインストールボタンを表示
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if (el.btnInstall) el.btnInstall.hidden = false;
  });
  // インストールボタン押下時にプロンプトを表示
  if (el.btnInstall) el.btnInstall.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if (choice && choice.outcome) {
      console.log('PWA install choice:', choice.outcome);
    }
    deferredPrompt = null;
    el.btnInstall.hidden = true;
  });
  // インストール完了イベント
  window.addEventListener('appinstalled', () => {
    console.log('PWA was installed');
    if (el.btnInstall) el.btnInstall.hidden = true;
    try { alert('アプリがインストールされました'); } catch (e) {}
  });

  // ---- 描画 ----
  function todayRecord() {
    return records[dateKey(new Date())] || null;
  }
  // 出勤済みの最新レコード (今日 / 過去問わず、日付降順の先頭)
  function latestRecord() {
    const keys = Object.keys(records).sort();
    for (let i = keys.length - 1; i >= 0; i--) {
      const r = records[keys[i]];
      if (r && r.in) return { key: keys[i], rec: r };
    }
    return null;
  }

  function renderClock() {
    const now = new Date();
    el.date.textContent = formatDateJP(now);
    el.clock.textContent = formatTime(now);

    // 出勤中はリアルタイムで勤務時間と休憩を更新
    const rec = todayRecord();
    if (rec && rec.in && !rec.out) {
      const nowIso = now.toISOString();
      const breaksMs = totalBreakMs(rec, nowIso);
      const workMin = netWorkMin(rec.in, nowIso, breaksMs);
      el.todayBreak.textContent = msToHMM(breaksMs);
      el.todayWork.textContent = workMin != null ? minToHMM(workMin) : "0:00";
      el.todayOvertime.textContent = workMin != null ? overtimeHMM(workMin) : "0:00";
    }
  }

  function renderState() {
    const rec = todayRecord();
    const hasIn = !!(rec && rec.in);
    const hasOut = !!(rec && rec.out);
    const onBreak = isOnBreak(rec);
    const nowIso = new Date().toISOString();

    // ステータス
    el.status.classList.remove("working", "done", "break", "none");
    if (!hasIn) {
      el.status.classList.add("none");
      el.statusText.textContent = "未出勤（本日は打刻されていません）";
    } else if (hasOut) {
      el.status.classList.add("done");
      el.statusText.textContent = "退勤済み";
    } else if (onBreak) {
      el.status.classList.add("break");
      el.statusText.textContent = "休憩中";
    } else {
      el.status.classList.add("working");
      el.statusText.textContent = "勤務中";
    }

    // ボタン
    // 退勤は「最新の出勤レコード」が存在し休憩中でない限り押下可 (翌日の出勤前は何度でも上書き可)
    const latest = latestRecord();
    const latestOnBreak = latest ? isOnBreak(latest.rec) : false;
    // ヘルパー（DOM が存在しない場合に備えて安全に操作）
    function setDisabled(btn, v) { if (btn) btn.disabled = v; }
    function setHidden(btn, v) { if (btn) btn.hidden = !!v; }

    // 基本ボタン制御
    // 出勤ボタンは「出勤済みかつ未退勤」の場合のみ無効にする
    setDisabled(el.btnIn, hasIn && !hasOut);
    setDisabled(el.btnOut, !latest || latestOnBreak);

    // 新しいボタンの有効/無効制御
    const enabledAfterIn = hasIn && !hasOut;
    // 外出/帰社 はトグル状態をレコードのフラグで保持
    const outingActive = !!(rec && rec.outing);
    const directActive = !!(rec && rec.direct);

    // 休憩中は他のボタンをすべて無効化（休憩の開始/終了のみ有効）
    if (onBreak) {
      setDisabled(el.btnIn, true);
      setDisabled(el.btnOut, true);
      // 休憩中は外出/直行ペアは非表示にする
      setDisabled(el.btnOuting, true); setHidden(el.btnOuting, true);
      setDisabled(el.btnReturn, true); setHidden(el.btnReturn, true);
      setDisabled(el.btnDirectGo, true); setHidden(el.btnDirectGo, true);
      setDisabled(el.btnDirectHome, true); setHidden(el.btnDirectHome, true);
      setDisabled(el.btnWFH, true);
      setDisabled(el.btnLeave, true);
      setDisabled(el.btnLeaveAM, true);
      setDisabled(el.btnLeavePM, true);
    } else {
      // 通常時の振る舞い
      // 外出/帰社は一つのボタンのように振る舞う（片方を表示、片方を非表示）
      if (!enabledAfterIn) {
        setHidden(el.btnOuting, true); setHidden(el.btnReturn, true);
      } else if (outingActive) {
        setHidden(el.btnOuting, true); setHidden(el.btnReturn, false);
        setDisabled(el.btnOuting, true); setDisabled(el.btnReturn, false);
      } else {
        setHidden(el.btnOuting, false); setHidden(el.btnReturn, true);
        setDisabled(el.btnOuting, false); setDisabled(el.btnReturn, true);
      }
      // 直行/直帰も同様
      if (!enabledAfterIn) {
        setHidden(el.btnDirectGo, true); setHidden(el.btnDirectHome, true);
      } else if (directActive) {
        setHidden(el.btnDirectGo, true); setHidden(el.btnDirectHome, false);
        setDisabled(el.btnDirectGo, true); setDisabled(el.btnDirectHome, false);
      } else {
        setHidden(el.btnDirectGo, false); setHidden(el.btnDirectHome, true);
        setDisabled(el.btnDirectGo, false); setDisabled(el.btnDirectHome, true);
      }
      setDisabled(el.btnWFH, !enabledAfterIn);
      // 休暇系は「退勤後」または「未出勤（記録なし）」で有効にする
      // （出勤済みで未退勤の時は無効）
      const leaveEnabled = hasOut || (!hasIn && !hasOut);
      setDisabled(el.btnLeave, !leaveEnabled);
      setDisabled(el.btnLeaveAM, !leaveEnabled);
      setDisabled(el.btnLeavePM, !leaveEnabled);
    }
    // 休憩ボタンは非表示のためラベル更新処理は削除

    // 当日サマリ
    const breaksMs = totalBreakMs(rec, hasOut ? (rec && rec.out) : nowIso);
    el.todayIn.textContent = hhmm(rec && rec.in) || "--:--";
    el.todayOut.textContent = hhmm(rec && rec.out) || "--:--";
    el.todayBreak.textContent = hasIn ? msToHMM(breaksMs) : "0:00";
    let workMin = null;
    if (hasIn && hasOut) workMin = netWorkMin(rec.in, rec.out, breaksMs);
    else if (hasIn) workMin = netWorkMin(rec.in, nowIso, breaksMs);
    el.todayWork.textContent = workMin != null ? minToHMM(workMin) : "--:--";
    el.todayOvertime.textContent = workMin != null ? overtimeHMM(workMin) : "--:--";

    renderHistory();
  }

  function renderHistory() {
    const keys = Object.keys(records).sort().reverse().slice(0, 14);
      if (keys.length === 0) {
      el.historyBody.innerHTML = `<tr><td class="empty" colspan="8">まだ記録がありません</td></tr>`;
      return;
    }
    el.historyBody.innerHTML = keys.map((k) => {
      const r = records[k];
      const d = new Date(k + "T00:00:00");
      const label = `${pad(d.getMonth() + 1)}/${pad(d.getDate())}(${WEEKDAYS[d.getDay()]})`;
      const inT = hhmm(r.in);
      const outT = hhmm(r.out);
      const breaksMs = totalBreakMs(r, r.out);
      const brk = breaksMs > 0 ? msToHMM(breaksMs) : null;
      const workMin = (r.in && r.out) ? netWorkMin(r.in, r.out, breaksMs) : null;
      const work = workMin != null ? minToHMM(workMin) : null;
      const overStr = workMin != null ? overtimeHMM(workMin) : null;
      // 0:00 はダッシュ表示
      const over = (overStr && overStr !== "0:00") ? overStr : null;
      // タグ表示を作成
      const tags = Array.isArray(r.tags) && r.tags.length > 0 ? r.tags.map(t => t.tag).join(' ') : null;
      // 状態表示：押された最後のボタンを優先して表示
      let state = null;
      if (isOnBreak(r)) state = '休憩中';
      else if (r.lastAction) state = r.lastAction;
      else if (r.out) state = '退勤済み';
      else if (r.in) state = '勤務中';
      else state = '未出勤';
      const cell = (v) => v ? `<td>${v}</td>` : `<td class="dash">—</td>`;
      // 状態列とタグ列を追加
      return `<tr><td>${label}</td>${cell(inT)}${cell(outT)}${cell(brk)}${cell(work)}${cell(over)}${cell(state)}${cell(tags)}</tr>`;
    }).join("");
  }

  // ---- 操作 ----
  function clockIn() {
    const key = dateKey(new Date());
    if (records[key] && records[key].in) return;
    records[key] = { in: new Date().toISOString(), out: null, breaks: [] };
    save(records);
    renderState();
  }

  function clockOut() {
    // 最新の出勤レコードの out を現在時刻で上書き (後優先)
    const target = latestRecord();
    if (!target) return;
    if (isOnBreak(target.rec)) return;
    target.rec.out = new Date().toISOString();
    save(records);
    renderState();
  }

  function toggleBreak() {
    const key = dateKey(new Date());
    const rec = records[key];
    if (!rec || !rec.in || rec.out) return;
    if (!Array.isArray(rec.breaks)) rec.breaks = [];
    if (isOnBreak(rec)) {
      rec.breaks[rec.breaks.length - 1].end = new Date().toISOString();
    } else {
      rec.breaks.push({ start: new Date().toISOString(), end: null });
    }
    save(records);
    renderState();
  }

  function clearAll() {
    if (!confirm("すべての打刻記録を削除します。よろしいですか?")) return;
    records = {};
    save(records);
    renderState();
  }

  // ---- 指紋認証 (WebAuthn) ----
  const AUTH_KEY = "dakoku_webauthn_v1";

  function authSupported() {
    return !!(window.PublicKeyCredential && window.isSecureContext && navigator.credentials);
  }
  function loadCredId() {
    try {
      const v = JSON.parse(localStorage.getItem(AUTH_KEY));
      return (v && v.credentialId) || null;
    } catch (e) { return null; }
  }
  function saveCredId(id) {
    localStorage.setItem(AUTH_KEY, JSON.stringify({ credentialId: id }));
  }
  function clearCredId() { localStorage.removeItem(AUTH_KEY); }

  function b64uEncode(buf) {
    const bytes = new Uint8Array(buf);
    let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64uDecode(str) {
    const padded = str + "=".repeat((4 - (str.length % 4)) % 4);
    const b64 = padded.replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  async function registerAuth() {
    if (!authSupported()) throw new Error("HTTPS (または localhost) 環境が必要です");
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    const userId = new Uint8Array(16); crypto.getRandomValues(userId);
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: "打刻アプリ" },
        user: { id: userId, name: "dakoku-user", displayName: "打刻ユーザー" },
        pubKeyCredParams: [
          { type: "public-key", alg: -7 },
          { type: "public-key", alg: -257 }
        ],
        authenticatorSelection: {
          authenticatorAttachment: "platform",
          userVerification: "required",
          residentKey: "preferred"
        },
        timeout: 60000,
        attestation: "none"
      }
    });
    if (!cred) throw new Error("認証情報を作成できませんでした");
    saveCredId(b64uEncode(cred.rawId));
  }

  async function verifyAuth() {
    const id = loadCredId();
    if (!id) throw new Error("認証情報が未登録です");
    const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge,
        timeout: 60000,
        userVerification: "required",
        allowCredentials: [{
          id: b64uDecode(id),
          type: "public-key",
          transports: ["internal"]
        }]
      }
    });
    if (!assertion) throw new Error("認証に失敗しました");
  }

  function renderAuthUI() {
    const supported = authSupported();
    const enabled = !!loadCredId();
    el.btnAuthSetup.hidden = !supported || enabled;
    el.btnAuthRemove.hidden = !supported || !enabled;
    el.authNote.hidden = supported;
  }

  async function handleSetupAuth() {
    try {
      await registerAuth();
      alert("指紋認証を有効にしました。\n次回起動時から認証が必要になります。");
      renderAuthUI();
    } catch (e) {
      if (e && e.name === "NotAllowedError") return;
      alert("認証設定に失敗しました: " + (e.message || e.name || e));
    }
  }

  function handleRemoveAuth() {
    if (!confirm("指紋認証を無効にします。よろしいですか?")) return;
    clearCredId();
    renderAuthUI();
  }

  let unlockInFlight = false;
  async function handleUnlock() {
    if (unlockInFlight) return;
    unlockInFlight = true;
    el.lockError.textContent = "";
    try {
      await verifyAuth();
      el.lockOverlay.classList.add("hidden");
    } catch (e) {
      if (e && e.name === "NotAllowedError") {
        el.lockError.textContent = "認証がキャンセルされました";
      } else {
        el.lockError.textContent = "認証に失敗しました: " + (e.message || e.name);
      }
      el.lockHint.textContent = "画面をタップして認証してください";
    } finally {
      unlockInFlight = false;
    }
  }

  function handleResetAuth() {
    if (!confirm("認証情報をリセットします。\n指紋認証は無効になり、ロックが解除されます。よろしいですか?")) return;
    clearCredId();
    el.lockOverlay.classList.add("hidden");
    renderAuthUI();
  }

  function initLockScreen() {
    if (authSupported() && loadCredId()) {
      el.lockOverlay.classList.remove("hidden");
      el.lockHint.textContent = "指紋認証を起動しています…";
      // 起動時に即座に認証ダイアログを試行 (環境により失敗時はタップで再実行)
      handleUnlock();
    } else {
      el.lockOverlay.classList.add("hidden");
    }
  }

  if (el.btnIn) el.btnIn.addEventListener("click", clockIn);
  if (el.btnOut) el.btnOut.addEventListener("click", clockOut);
  // 'その他' パネルは全て表示する仕様にしたため、関連する DOM 操作は不要
